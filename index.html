<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INVENTARIO/VENTAS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            /* Paleta Neumorfismo / Skeuomorfismo Claro Extra Grande */
            --bg-base: #e2e8f0;
            --panel-bg: #edf2f7;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-stroke: #cbd5e1;
            
            /* Sombras 3D ultra marcadas */
            --shadow-extruded: 10px 10px 20px #b8c2cc, -10px -10px 20px #ffffff;
            --shadow-btn: 6px 6px 14px #b8c2cc, -6px -6px 14px #ffffff;
            --shadow-pressed: inset 5px 5px 10px #b8c2cc, inset -5px -5px 10px #ffffff;
            
            /* Acentos */
            --accent-purple: #4f46e5;
            --accent-green: #059669;
            --accent-danger: #dc2626;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            background: var(--bg-base); 
            color: var(--text-main); 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
        }

        .screen { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
            position: absolute; 
            padding: 16px; 
            background: var(--bg-base); 
            z-index: 1; 
        } 
        
        .hidden { display: none !important; }

        /* CÁMARA */
        .cam-box { 
            width: 100%; 
            flex: 1; 
            border: 3px solid var(--border-stroke); 
            border-radius: 28px; 
            overflow: hidden; 
            margin-bottom: 16px; 
            background: #ffffff;
            box-shadow: var(--shadow-extruded);
        }

        .scan-counter {
            position: fixed;
            bottom: 185px;
            left: 16px;
            right: 16px;
            background: #ffffff;
            border: 3px solid #10b981;
            color: #065f46;
            padding: 18px 24px;
            border-radius: 24px;
            text-align: center;
            font-weight: 900;
            font-size: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: var(--shadow-btn);
        }

        /* BOTONES ULTRA GRANDES SKEUOMÓRFICOS */
        .btn-skeuo {
            width: 100%;
            min-height: 75px; /* Ampliado para máxima comodidad táctil */
            padding: 18px 24px;
            border-radius: 26px;
            border: 3px solid var(--border-stroke);
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            box-shadow: var(--shadow-btn);
            transition: all 0.12s ease;
            cursor: pointer;
        }

        .btn-skeuo:active {
            box-shadow: var(--shadow-pressed);
            transform: translateY(3px);
        }

        .btn-purple { 
            background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%); 
            border-color: #3730a3; 
        }
        
        .btn-green { 
            background: linear-gradient(180deg, #10b981 0%, #047857 100%); 
            border-color: #065f46; 
        }

        .btn-neutral { 
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); 
            color: var(--text-main); 
            border-color: #94a3b8;
        }

        .btn-back-fixed { 
            position: fixed; 
            bottom: 16px; 
            left: 16px; 
            right: 16px; 
            height: 70px;
            z-index: 100; 
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); 
            border: 3px solid #64748b; 
            color: #1e293b; 
            border-radius: 26px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 900;
            box-shadow: var(--shadow-btn);
        }

        .btn-back-fixed:active {
            box-shadow: var(--shadow-pressed);
        }

        /* TICKET Y CALCULADORA MAXI */
        .ticket-area { 
            height: 34vh; 
            background: #ffffff; 
            color: var(--text-main); 
            border-radius: 28px; 
            border: 3px solid var(--border-stroke);
            margin-bottom: 12px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: var(--shadow-extruded);
        }

        .receipt-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
        }

        .receipt-row { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 2px dashed #cbd5e1; 
            padding: 14px 0; 
            align-items: center; 
            font-size: 1.1rem;
            font-weight: 800;
        }

        .calc-area { 
            height: 52vh; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            padding-bottom: 90px; 
        }

        .calc-display { 
            grid-column: span 3; 
            background: #f1f5f9; 
            color: #0f172a; 
            text-align: right; 
            padding: 10px 24px; 
            font-size: 2.5rem; 
            font-weight: 900;
            border-radius: 24px; 
            border: 3px solid var(--border-stroke); 
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-shadow: var(--shadow-pressed);
        }

        .num-btn { 
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); 
            border: 3px solid var(--border-stroke); 
            color: var(--text-main); 
            border-radius: 24px; 
            font-size: 2rem; 
            font-weight: 900; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: var(--shadow-btn);
            transition: all 0.1s ease;
        }

        .num-btn:active {
            box-shadow: var(--shadow-pressed);
            transform: scale(0.95);
        }

        /* MODALES */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.5); 
            backdrop-filter: blur(6px);
            z-index: 5000; 
            display: none; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }

        .lookup-card { 
            background: var(--panel-bg); 
            border: 4px solid #ffffff; 
            border-radius: 36px; 
            padding: 30px; 
            width: 100%; 
            text-align: center;
            box-shadow: var(--shadow-extruded);
        }

        .l-name { 
            color: var(--text-main); 
            font-size: 2rem; 
            font-weight: 900; 
        }

        .l-price { 
            color: var(--accent-purple);
            font-size: 4.5rem; 
            font-weight: 900; 
            margin: 10px 0; 
        }

        /* INPUTS & SELECTS */
        select, input { 
            width: 100%; 
            height: 65px;
            padding: 16px 20px; 
            margin: 10px 0; 
            background: #ffffff; 
            color: var(--text-main); 
            border: 3px solid var(--border-stroke); 
            border-radius: 22px; 
            font-size: 1.2rem;
            font-weight: 800;
            outline: none;
            box-shadow: var(--shadow-pressed);
        }

        .inv-item { 
            background: #ffffff; 
            padding: 20px; 
            margin-bottom: 14px; 
            border-radius: 24px; 
            border: 3px solid var(--border-stroke); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: var(--shadow-btn);
            font-size: 1.1rem;
        }

        .data-row { display: flex; gap: 12px; margin-top: 6px; }

        .btn-data { 
            flex: 1; 
            height: 65px;
            border-radius: 22px; 
            border: 3px solid var(--border-stroke); 
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); 
            color: var(--text-sub); 
            font-size: 1rem; 
            font-weight: 900; 
            box-shadow: var(--shadow-btn);
        }

        .btn-data:active {
            box-shadow: var(--shadow-pressed);
        }

        /* BOTÓN HERO INICIO */
        .btn-start-hero {
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            border: 5px solid #ffffff; 
            background: linear-gradient(180deg, #6366f1 0%, #3730a3 100%); 
            color: #ffffff;
            font-weight: 900;
            font-size: 1.8rem;
            box-shadow: var(--shadow-extruded);
            transition: all 0.2s ease;
        }

        .btn-start-hero:active { 
            box-shadow: var(--shadow-pressed);
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <div id="scr-home" class="screen" style="justify-content:center; align-items:center;">
        <h1 style="font-size:3.5rem; margin:0; font-weight:900; color:var(--text-main);">SCANNER</h1>
        <div style="color:var(--accent-purple); font-weight:900; margin-bottom:50px; letter-spacing:4px; font-size:1.4rem;">PRO V6.0</div>
        <button class="btn-start-hero" onclick="irA('scr-menu')">INICIAR</button>
    </div>

    <div id="scr-menu" class="screen hidden">
        <div class="cam-box" style="flex:0 0 25vh;"><div id="reader-menu"></div></div>
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom: 80px;">
            <button class="btn-skeuo btn-purple" onclick="irA('scr-inv')">📋 INVENTARIO / EDITAR</button>
            <button class="btn-skeuo btn-neutral" onclick="ajustarTasa()">💵 TASA: <span id="tasa-val">0</span> Bs</button>
            <button class="btn-skeuo btn-green" onclick="irA('scr-scan')">🛒 MODO ESCANEO</button>
            <button class="btn-skeuo btn-neutral" onclick="irA('scr-ticket')">📄 VER TICKET / CALC</button>
            <div class="data-row">
                <button class="btn-data" onclick="exportarData()">📤 EXPORTAR</button>
                <button class="btn-data" onclick="document.getElementById('fileInput').click()">📥 IMPORTAR</button>
                <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importarData(event)">
            </div>
        </div>
        <div class="btn-back-fixed" onclick="irA('scr-home')">CERRAR SESIÓN</div>
    </div>

    <div id="scr-scan" class="screen hidden">
        <div class="cam-box"><div id="reader-scan"></div></div>
        
        <div id="scan-indicator" class="scan-counter">
            <span>ARTÍCULOS: <span id="scan-qty">0</span></span>
            <span>TOTAL: $<span id="scan-total">0.00</span></span>
        </div>

        <button class="btn-skeuo btn-green" style="position:fixed; bottom:95px; left:16px; width:calc(100% - 32px); z-index:10;" onclick="irA('scr-ticket')">IR AL TICKET</button>
        <div class="btn-back-fixed" onclick="irA('scr-menu')">VOLVER AL MENÚ</div>
    </div>

    <div id="scr-ticket" class="screen hidden">
        <div class="ticket-area">
            <div id="lista-ticket" class="receipt-list"></div>
            <div id="total-ticket" style="padding:16px; background: #f8fafc; border-top:3px solid var(--border-stroke); text-align:right; font-weight:900; font-size:1.3rem; color:#059669;">
                $0.00 | 0.00 Bs
            </div>
        </div>
        <div class="calc-area">
            <div id="calc-screen" class="calc-display">0</div>
            <button class="num-btn" onclick="numKey('7')">7</button><button class="num-btn" onclick="numKey('8')">8</button><button class="num-btn" onclick="numKey('9')">9</button>
            <button class="num-btn" onclick="numKey('4')">4</button><button class="num-btn" onclick="numKey('5')">5</button><button class="num-btn" onclick="numKey('6')">6</button>
            <button class="num-btn" onclick="numKey('1')">1</button><button class="num-btn" onclick="numKey('2')">2</button><button class="num-btn" onclick="numKey('3')">3</button>
            <button class="num-btn" onclick="numKey('.')">.</button><button class="num-btn" onclick="numKey('0')">0</button><button class="num-btn" style="background: #fee2e2; color: var(--accent-danger); border-color: #fca5a5;" onclick="numKey('C')">C</button>
            <button class="num-btn" style="grid-column: span 2; background: #d1fae5; color: #065f46; border-color: #6ee7b7; font-size: 1.4rem;" onclick="addManual()">SUMAR (+)</button>
            <button class="num-btn" onclick="if(confirm('¿Limpiar ticket?')) { venta = []; updateTicketUI(); }">🗑️</button>
        </div>
        <div class="btn-back-fixed" onclick="irA('scr-scan')">VOLVER A ESCANEAR</div>
    </div>

    <div id="scr-inv" class="screen hidden">
        <div style="display:flex; gap:12px;">
            <button class="btn-skeuo btn-purple" style="flex:1;" onclick="nuevaCat()">+ CATEGORÍA</button>
            <button class="btn-skeuo btn-neutral" style="width:75px;" onclick="borrarCatActual()">🗑️</button>
        </div>
        <select id="filtro-cat" onchange="renderInv()"></select>
        <div id="inv-list" style="flex:1; overflow-y:auto; margin-top:8px; margin-bottom: 80px;"></div>
        <div class="btn-back-fixed" onclick="irA('scr-menu')">VOLVER AL MENÚ</div>
    </div>

    <div id="lookup-modal" class="modal-overlay" onclick="cerrarModal('lookup-modal')">
        <div class="lookup-card">
            <div id="l-name" class="l-name">PRODUCTO</div>
            <div id="l-price" class="l-price">$0.00</div>
            <div id="l-bs" style="color:var(--text-sub); font-size:1.6rem; font-weight:900;">0.00 Bs</div>
        </div>
    </div>

    <div id="reg-modal" class="modal-overlay">
        <div class="lookup-card" style="text-align:left;">
            <h2 id="modal-title" style="color:var(--accent-purple); margin:0 0 15px 0; font-weight:900; font-size: 1.8rem;">REGISTRAR</h2>
            <input type="text" id="m-nom" placeholder="Nombre">
            <input type="number" id="m-pre" placeholder="Precio $" step="0.01">
            <select id="m-cat"></select>
            <div style="display:flex; gap:12px; margin-top:20px;">
                <button class="btn-skeuo btn-neutral" style="flex:1;" onclick="cerrarModal('reg-modal')">CANCELAR</button>
                <button class="btn-skeuo btn-purple" style="flex:1;" onclick="saveProd()">GUARDAR</button>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = 'SCAN_DB_V6.0';
        let DB = JSON.parse(localStorage.getItem(DB_NAME)) || { productos: {}, cats: ["General"], tasa: 36.5 };
        let html5QrCode = null, venta = [], calcInput = "0", isProcessing = false, currentId = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Scanner Offline Listo'))
                    .catch(err => console.log('Error de registro SW', err));
            });
        }

        async function irA(id) {
            if (html5QrCode) { try { await html5QrCode.stop(); html5QrCode = null; } catch(e) {} }
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'scr-menu') startCam("reader-menu", true);
            if (id === 'scr-scan') { startCam("reader-scan", false); updateScanIndicator(); }
            if (id === 'scr-ticket') updateTicketUI();
            if (id === 'scr-inv') renderInv();
            document.getElementById('tasa-val').innerText = DB.tasa.toFixed(2);
        }

        async function startCam(divId, isMenu) {
            isProcessing = false;
            html5QrCode = new Html5Qrcode(divId);
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (code) => {
                    if (isProcessing) return;
                    const p = DB.productos[code];
                    if (isMenu) {
                        isProcessing = true;
                        if (p) {
                            document.getElementById('l-name').innerText = p.nombre;
                            document.getElementById('l-price').innerText = "$" + p.precio.toFixed(2);
                            document.getElementById('l-bs').innerText = (p.precio * DB.tasa).toFixed(2) + " Bs";
                            document.getElementById('lookup-modal').style.display = 'flex';
                        } else { openEditor(code); }
                    } else if (p) {
                        venta.push({ id: code, nombre: p.nombre, precio: p.precio });
                        if (navigator.vibrate) navigator.vibrate(50);
                        updateScanIndicator();
                        isProcessing = true; setTimeout(() => isProcessing = false, 1200);
                    }
                });
            } catch (e) {}
        }

        function updateScanIndicator() {
            const total = venta.reduce((acc, item) => acc + item.precio, 0);
            document.getElementById('scan-qty').innerText = venta.length;
            document.getElementById('scan-total').innerText = total.toFixed(2);
        }

        function openEditor(code, isEdit = false) {
            currentId = code;
            const p = DB.productos[code] || { nombre: "", precio: "", cat: "General" };
            document.getElementById('modal-title').innerText = isEdit ? "EDITAR" : "REGISTRAR";
            document.getElementById('m-nom').value = p.nombre;
            document.getElementById('m-pre').value = p.precio;
            document.getElementById('m-cat').innerHTML = DB.cats.map(c => `<option value="${c}" ${c===p.cat?'selected':''}>${c}</option>`).join('');
            document.getElementById('reg-modal').style.display = 'flex';
        }

        function saveProd() {
            const n = document.getElementById('m-nom').value.trim(), p = document.getElementById('m-pre').value;
            if(!n || !p) return;
            DB.productos[currentId] = { nombre: n, precio: parseFloat(p), cat: document.getElementById('m-cat').value };
            localStorage.setItem(DB_NAME, JSON.stringify(DB));
            cerrarModal('reg-modal');
            renderInv();
        }

        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; isProcessing = false; }
        
        function nuevaCat() { 
            let n = prompt("Nombre categoría:"); 
            if(n) { DB.cats.push(n); localStorage.setItem(DB_NAME, JSON.stringify(DB)); renderInv(); } 
        }

        function borrarCatActual() {
            const c = document.getElementById('filtro-cat').value;
            if(c === "Todas" || c === "General") return;
            if(confirm(`¿Borrar categoría "${c}"?`)) {
                Object.values(DB.productos).forEach(p => { if(p.cat === c) p.cat = "General"; });
                DB.cats = DB.cats.filter(x => x !== c);
                localStorage.setItem(DB_NAME, JSON.stringify(DB));
                renderInv();
            }
        }

        function renderInv() {
            const f = document.getElementById('filtro-cat').value || "Todas";
            document.getElementById('filtro-cat').innerHTML = `<option value="Todas">Ver Todas</option>` + DB.cats.map(c => `<option value="${c}" ${c===f?'selected':''}>${c}</option>`).join('');
            let html = "";
            Object.keys(DB.productos).forEach(id => {
                const p = DB.productos[id];
                if (f === "Todas" || p.cat === f) {
                    html += `<div class="inv-item"><div onclick="openEditor('${id}', true)" style="flex:1"><b>${p.nombre}</b><br><small style="color:var(--accent-purple); font-weight:900;">$${p.precio.toFixed(2)}</small></div><button style="color:var(--accent-danger);border:none;background:none;font-weight:900;font-size:1.4rem;padding:10px;" onclick="borrarProd('${id}')">✕</button></div>`;
                }
            });
            document.getElementById('inv-list').innerHTML = html;
        }

        function borrarProd(id) { if(confirm("¿Eliminar?")) { delete DB.productos[id]; localStorage.setItem(DB_NAME, JSON.stringify(DB)); renderInv(); } }

        function exportarData() {
            const f = new Date();
            const nombre = `inv_${f.getDate()}-${f.getMonth()+1}.json`;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr); dl.setAttribute("download", nombre);
            dl.click();
        }

        function importarData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(data.productos) { DB = data; localStorage.setItem(DB_NAME, JSON.stringify(DB)); location.reload(); }
                } catch(err) { alert("Error"); }
            };
            reader.readAsText(e.target.files[0]);
        }

        function numKey(val) {
            if (val === 'C') calcInput = "0";
            else if (val === '.') { if (!calcInput.includes('.')) calcInput += '.'; }
            else { calcInput = calcInput === "0" ? val : calcInput + val; }
            document.getElementById('calc-screen').innerText = calcInput;
        }
        function addManual() {
            let m = parseFloat(calcInput);
            if (m > 0) { venta.push({ id: 'man-'+Date.now(), nombre: 'Manual', precio: m }); updateTicketUI(); numKey('C'); }
        }
        function updateTicketUI() {
            const lista = document.getElementById('lista-ticket');
            const agrupados = venta.reduce((acc, item) => {
                const key = item.nombre === 'Manual' ? item.id : item.id;
                if (!acc[key]) acc[key] = { ...item, qty: 0, subtotal: 0 };
                acc[key].qty++; acc[key].subtotal += item.precio;
                return acc;
            }, {});
            let html = "", total = 0;
            Object.values(agrupados).forEach(p => {
                total += p.subtotal;
                html += `<div class="receipt-row"><div><b>${p.nombre}</b> ${p.qty>1?'x'+p.qty:''}</div><div>$${p.subtotal.toFixed(2)} <button style="color:var(--accent-danger);border:none;background:none;font-weight:900;margin-left:12px;font-size:1.2rem;" onclick="eliminarUno('${p.id}')">✕</button></div></div>`;
            });
            lista.innerHTML = html;
            document.getElementById('total-ticket').innerText = `$${total.toFixed(2)} | ${(total * DB.tasa).toFixed(2)} Bs`;
        }
        function eliminarUno(id) { const idx = venta.findIndex(x => x.id === id); if (idx > -1) { venta.splice(idx, 1); updateTicketUI(); } }
        function ajustarTasa() { let t = prompt("Tasa:", DB.tasa); if(t) { DB.tasa = parseFloat(t); localStorage.setItem(DB_NAME, JSON.stringify(DB)); document.getElementById('tasa-val').innerText = DB.tasa.toFixed(2); } }
    </script>
</body>
</html>
